<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Flip</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#121212;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
    width:90%;
    max-width:800px;
}

h1{
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#ffb300;
    color:black;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

#coin{
    width:180px;
    height:180px;
    margin:40px auto;
    border-radius:50%;
    background:linear-gradient(145deg,#f7d046,#c99300);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    font-weight:bold;
    color:black;
    box-shadow:0 0 30px rgba(255,180,0,.3);
    display:none;
}

.flip{
    animation:spin 2.5s ease-in-out;
}

@keyframes spin{

0%{
transform:rotateY(0deg);
}

100%{
transform:rotateY(2160deg);
}

}

#result{
    display:none;
    margin-top:30px;
}

#result img{
    width:100%;
    max-width:700px;
    border-radius:18px;
    box-shadow:0 0 40px rgba(0,0,0,.5);
}

h2{
    margin-bottom:20px;
}

</style>

</head>
<body>

<div class="container">

<h1>Flip the Coin</h1>

<button id="flipButton">Flip Coin</button>

<div id="coin">🪙</div>

<div id="result">
<h2 id="text"></h2>
<img id="image" src="">
</div>

</div>

<script>

const button=document.getElementById("flipButton");
const coin=document.getElementById("coin");
const result=document.getElementById("result");
const image=document.getElementById("image");
const text=document.getElementById("text");

button.onclick=function(){

button.disabled=true;
button.style.display="none";

coin.style.display="flex";
coin.classList.add("flip");

setTimeout(()=>{

coin.classList.remove("flip");

const flip=Math.random()<0.5;

if(flip){

text.innerText="Heads";
image.src="heads.jpg";

}else{

text.innerText="Tails";
image.src="tails.jpg";

}

result.style.display="block";

},2500);

}

</script>

</body>
</html>
